# Local infrastructure — the whole system runs here by design. Services
# are added phase by phase.
services:
  sqlserver:
    # The schema is kept Azure SQL Database-compatible, so an optional
    # cloud deployment path stays open as a final step.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loan-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Non-secret local dev default, overridable via env. Real environments
      # get credentials from Vault through ISecretProvider (Phase 3.5).
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LoanDev!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  vault:
    # Dev-mode Vault (phase 3.5): in-memory, auto-unsealed, root token is a
    # non-secret local default. Every runtime secret the app reads goes
    # through here from now on — most importantly the Stripe key in phase 4,
    # which must never have an appsettings phase in its life.
    image: hashicorp/vault:1.17
    container_name: loan-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:-loan-dev-root}"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb:
    # Operational audit log + flexible-schema loan applications (phase 2).
    image: mongo:8
    container_name: loan-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      # Non-secret local dev default, same policy as the SQL password.
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-LoanDevMongo1}"
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redpanda:
    # Kafka-compatible event streaming (phase 5): carries the loan-events
    # topic the dispatcher publishes from the ledger; the read side (phase 6)
    # consumes it.
    image: redpandadata/redpanda:v24.1.1
    container_name: loan-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  rabbitmq:
    # Async task queue (phase 5): payment notifications. guest/guest only
    # works from localhost by RabbitMQ's own rules — a non-secret dev default.
    image: rabbitmq:4-management
    container_name: loan-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    # Cache (phase 5): rate sheet lookups.
    image: redis:7
    container_name: loan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  seq:
    # Structured-log server (phase 8): Serilog ships logs here. UI and ingestion
    # share port 80 in the container; browse http://localhost:5341. Pinned to a
    # version (not :latest) for reproducibility. Recent Seq forces a first-run auth
    # choice — local dev opts out of authentication (single-user, no login).
    image: datalust/seq:2026.1
    container_name: loan-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  sqlserver-data:
  mongodb-data:
  redpanda-data:
  rabbitmq-data:
  seq-data:
