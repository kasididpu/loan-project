# Load balancer in front of the API replicas (Phase 9, local HA demo).
# Open-source nginx has no active health checks (that is nginx Plus), so it
# relies on *passive* checks: after one failed proxy attempt a replica is taken
# out of rotation for fail_timeout — which is what makes a killed replica
# transparent to clients during the failover test.

events {}

http {
    upstream loan_api {
        server api1:8080 max_fails=1 fail_timeout=10s;
        server api2:8080 max_fails=1 fail_timeout=10s;
        server api3:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        # If the chosen replica dies mid-request, transparently retry the next
        # one so the client still gets an answer while nginx marks the dead one
        # down. Cap the retries so a genuine 5xx is not amplified across replicas.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        location / {
            proxy_pass http://loan_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Surfaces which replica answered — makes the failover demo visible:
            # watch this header change as replicas are stopped and started.
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
